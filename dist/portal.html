<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#111411" />
    <meta
      name="description"
      content="Delux crew — a considered workspace for your workflows, provider connections, and personal style."
    />
    <title>Delux crew — Space to do your best work</title>
    <style>:root {
  font-family:
    system-ui,
    -apple-system,
    BlinkMacSystemFont,
    'Segoe UI',
    sans-serif;
  --bg: #111411;
  --panel: #1e211d;
  --raised: #272a25;
  --fg: #f6f4ed;
  --muted: #adb0a6;
  --line: #3c4036;
  --accent: #c5a572;
  --on-accent: #111;
  --highlight: #c5a572;
  color-scheme: dark;
}
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
  scroll-padding-top: 100px;
}
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-size: 15px;
  line-height: 1.6;
}
button,
input,
select,
textarea {
  font: inherit;
}
a {
  color: inherit;
  text-decoration: none;
}
button,
a,
input,
textarea,
select,
summary {
  outline-offset: 5px;
}
button:focus-visible,
a:focus-visible,
summary:focus-visible {
  outline: 2px solid var(--highlight);
}
button {
  cursor: pointer;
}
button:disabled {
  cursor: wait;
  opacity: 0.55;
}
button,
a {
  touch-action: manipulation;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1,
h2,
h3 {
  font-weight: 450;
  line-height: 1.13;
  letter-spacing: -0.045em;
}
h1 {
  font-size: clamp(44px, 5.7vw, 80px);
}
h2 {
  font-size: clamp(30px, 3.2vw, 46px);
}
h3 {
  font-size: 23px;
}
p {
  color: var(--muted);
}
small {
  font-size: 12px;
  color: var(--muted);
}
.wrap {
  max-width: 1320px;
  margin: auto;
  padding: 0 48px;
}
.header {
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 5;
}
.nav {
  min-height: 94px;
  display: flex;
  align-items: center;
  gap: 36px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 12px;
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.04em;
  white-space: nowrap;
}
.brand span {
  border-left: 1px solid var(--line);
  padding-left: 16px;
}
.contact {
  position: relative;
}
.contact summary {
  list-style: none;
  cursor: pointer;
  padding: 6px;
  border-radius: 8px;
  background: #111;
}
.contact summary::-webkit-details-marker {
  display: none;
}
.contact img {
  display: block;
  width: 69px;
  height: 34px;
  object-fit: contain;
}
.contact-card {
  position: absolute;
  top: 62px;
  left: 0;
  width: min(310px, calc(100vw - 40px));
  background: var(--panel);
  border: 1px solid var(--line);
  padding: 24px;
  box-shadow: 0 16px 48px #0006;
  border-radius: 12px;
  font-size: 14px;
}
.contact-card a {
  display: block;
  margin-top: 10px;
  text-decoration: underline;
  overflow-wrap: anywhere;
}
.nav-links {
  display: flex;
  gap: 28px;
  margin-left: auto;
  align-items: center;
  font-size: 13px;
}
.nav-links a:hover,
.footer a:hover {
  color: var(--highlight);
}
.nav-actions {
  display: flex;
  align-items: center;
  gap: 20px;
  font-size: 13px;
}
.button {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 22px;
  border: 1px solid var(--accent);
  border-radius: 4px;
  background: var(--accent);
  color: var(--on-accent);
  padding: 13px 23px;
  font-size: 13px;
  font-weight: 650;
  letter-spacing: 0.015em;
  line-height: 1.5;
}
.button:hover {
  filter: brightness(1.1);
}
.button.secondary {
  background: transparent;
  color: var(--fg);
  border-color: var(--line);
}
.button.small {
  padding: 9px 15px;
  gap: 10px;
}
.button.danger {
  background: transparent;
  color: var(--fg);
  border-color: var(--line);
}
.eyebrow {
  display: flex;
  align-items: center;
  gap: 12px;
  text-transform: uppercase;
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.23em;
  color: var(--highlight);
  margin-bottom: 26px;
}
.eyebrow:before {
  content: '';
  width: 24px;
  height: 1px;
  background: currentColor;
}
.hero {
  padding: 88px 0 76px;
  display: grid;
  grid-template-columns: 1.04fr 1fr;
  gap: 70px;
  align-items: center;
}
.hero h1 em {
  font-style: normal;
  color: var(--highlight);
}
.hero .intro {
  max-width: 445px;
  margin: 27px 0 32px;
  font-size: 16px;
  line-height: 1.8;
}
.actions {
  display: flex;
  align-items: center;
  gap: 14px;
  flex-wrap: wrap;
}
.hero-note {
  font-size: 11px;
  margin-top: 23px;
  display: flex;
  align-items: center;
  gap: 9px;
}
.dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
  background: var(--accent);
}
.scene {
  position: relative;
  padding: 25px 0 25px 28px;
}
.scene:before {
  content: '';
  position: absolute;
  inset: -30px;
  background: radial-gradient(ellipse, var(--accent), transparent 65%);
  opacity: 0.065;
  pointer-events: none;
}
.demo-window {
  position: relative;
  border: 1px solid var(--line);
  border-radius: 9px;
  background: var(--panel);
  box-shadow: 0 32px 70px #0004;
  transform: perspective(1000px) rotateY(-5deg) rotateX(3deg);
  overflow: hidden;
}
.demo-head {
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--line);
  padding: 18px 22px;
  font-size: 11px;
  letter-spacing: 0.04em;
}
.demo-dots {
  display: flex;
  gap: 5px;
}
.demo-dots i {
  width: 5px;
  height: 5px;
  background: var(--muted);
  opacity: 0.5;
  border-radius: 50%;
}
.demo-body {
  padding: 28px 22px 35px;
}
.demo-title {
  font-size: 22px;
  letter-spacing: -0.04em;
  color: var(--fg);
}
.demo-sub {
  font-size: 10px;
  margin: 6px 0 22px;
}
.demo-stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  margin-bottom: 26px;
}
.demo-stat {
  border: 1px solid var(--line);
  padding: 13px 14px;
  border-radius: 4px;
}
.demo-stat b {
  display: block;
  font-size: 22px;
  font-weight: 500;
  color: var(--fg);
}
.demo-stat span {
  font-size: 9px;
  color: var(--muted);
}
.demo-row {
  display: flex;
  gap: 12px;
  align-items: center;
  padding: 13px 0;
  border-top: 1px solid var(--line);
  font-size: 10px;
}
.demo-icon {
  display: grid;
  place-items: center;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 5px;
  width: 28px;
  height: 28px;
  color: var(--highlight);
}
.demo-row small {
  display: block;
  font-size: 9px;
}
.demo-row .pill {
  margin-left: auto;
}
.pill {
  display: inline-flex;
  align-items: center;
  gap: 7px;
  padding: 4px 9px;
  border: 1px solid var(--line);
  border-radius: 30px;
  font-size: 10px;
  color: var(--muted);
  white-space: nowrap;
}
.pill.active {
  color: var(--highlight);
}
.scene-caption {
  text-align: right;
  margin: 20px 4px 0;
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}
.floating-note {
  position: absolute;
  bottom: 1px;
  left: -3px;
  padding: 15px 21px;
  background: var(--raised);
  border: 1px solid var(--line);
  border-radius: 6px;
  box-shadow: 0 12px 25px #0003;
  font-size: 11px;
}
.floating-note span {
  color: var(--highlight);
  margin-right: 10px;
}
.providers-band {
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 25px 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 25px;
}
.providers-band > p {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.16em;
  max-width: 170px;
}
.provider-names {
  display: flex;
  gap: 48px;
  align-items: center;
}
.provider-name {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 18px;
  letter-spacing: -0.03em;
  font-weight: 550;
}
.provider-mark {
  width: 30px;
  height: 30px;
  border: 1px solid var(--line);
  border-radius: 9px;
  display: inline-grid;
  place-items: center;
  font-size: 15px;
  color: var(--highlight);
}
.provider-names small {
  display: block;
  font-size: 9px;
  font-weight: 400;
  letter-spacing: 0;
}
.section {
  padding: 83px 0;
  border-bottom: 1px solid var(--line);
}
.section-top {
  display: flex;
  justify-content: space-between;
  gap: 36px;
  align-items: end;
  margin-bottom: 40px;
}
.section-top > p {
  max-width: 360px;
  font-size: 14px;
}
.features {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 36px;
}
.feature {
  border-top: 1px solid var(--line);
  padding-top: 27px;
}
.number {
  font-size: 11px;
  color: var(--highlight);
  display: block;
  margin-bottom: 26px;
}
.feature h3 {
  font-size: 24px;
  margin-bottom: 15px;
}
.feature p {
  font-size: 13px;
  line-height: 1.8;
}
.feature-link {
  display: inline-block;
  font-size: 12px;
  color: var(--highlight);
  margin-top: 20px;
}
.closing {
  padding: 75px 0;
  text-align: center;
}
.closing p {
  margin: 18px auto 28px;
  max-width: 480px;
}
.footer {
  border-top: 1px solid var(--line);
  padding: 26px 0;
  font-size: 11px;
  display: flex;
  justify-content: space-between;
  gap: 20px;
  color: var(--muted);
}
.footer-links {
  display: flex;
  gap: 22px;
}
.auth {
  min-height: calc(100vh - 95px);
  display: grid;
  grid-template-columns: 1fr 1fr;
}
.auth-story {
  padding: 80px 85px 80px 0;
  display: flex;
  flex-direction: column;
  justify-content: center;
  border-right: 1px solid var(--line);
}
.auth-story h1 {
  font-size: 57px;
  max-width: 490px;
}
.auth-story > p {
  margin: 25px 0 35px;
  max-width: 400px;
}
.auth-points {
  display: grid;
  gap: 20px;
}
.auth-point {
  display: flex;
  gap: 18px;
  align-items: center;
  font-size: 13px;
  color: var(--muted);
}
.auth-point span {
  color: var(--highlight);
}
.auth-form-wrap {
  padding: 65px 0 65px 80px;
  align-self: center;
}
.auth-form-wrap h2 {
  font-size: 32px;
}
.auth-form-wrap > p {
  font-size: 13px;
  margin: 13px 0 28px;
}
.form {
  display: grid;
  gap: 18px;
}
.field {
  display: grid;
  gap: 7px;
  font-size: 12px;
  font-weight: 550;
  letter-spacing: 0.015em;
}
.field input,
.field select,
.field textarea,
.search {
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 12px 13px;
  color: var(--fg);
  min-width: 0;
}
.field input:focus,
.field textarea:focus,
.field select:focus,
.search:focus {
  outline: 2px solid var(--highlight);
  outline-offset: 1px;
}
.field input[type='color'] {
  height: 48px;
  padding: 5px;
  cursor: pointer;
}
.field textarea {
  resize: vertical;
  min-height: 90px;
}
.two-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.form-error {
  color: var(--fg);
  font-size: 13px;
  border-left: 2px solid var(--accent);
  padding-left: 12px;
}
.form-error:empty {
  display: none;
}
.form-foot {
  font-size: 12px;
  text-align: center;
  margin-top: 20px;
}
.form-foot a {
  text-decoration: underline;
  text-underline-offset: 4px;
  color: var(--fg);
}
.workspace {
  padding-top: 46px;
  padding-bottom: 70px;
}
.workspace-title {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
  margin-bottom: 28px;
}
.workspace-title h1 {
  font-size: 38px;
}
.workspace-title p {
  font-size: 13px;
  margin-top: 10px;
}
.workspace-title .eyebrow {
  margin-bottom: 15px;
}
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 25px;
}
.stat {
  border: 1px solid var(--line);
  border-radius: 7px;
  padding: 20px 23px;
  background: var(--panel);
}
.stat p {
  font-size: 11px;
}
.stat strong {
  display: block;
  font-size: 31px;
  font-weight: 450;
  letter-spacing: -0.04em;
  margin-top: 6px;
}
.workspace-providers {
  display: flex;
  gap: 14px;
  flex-wrap: wrap;
  margin-bottom: 33px;
}
.provider-chip {
  display: flex;
  align-items: center;
  gap: 10px;
  border: 1px solid var(--line);
  border-radius: 5px;
  padding: 10px 14px;
  font-size: 12px;
}
.provider-chip span:last-child {
  font-size: 10px;
  color: var(--muted);
  border-left: 1px solid var(--line);
  padding-left: 10px;
}
.toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 18px;
  margin-bottom: 23px;
}
.toolbar h2 {
  font-size: 23px;
}
.search {
  max-width: 260px;
  font-size: 12px;
}
.board {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 17px;
  align-items: start;
}
.column {
  border: 1px solid var(--line);
  border-radius: 7px;
  background: var(--panel);
  padding: 14px;
  min-height: 220px;
}
.column h3 {
  font-size: 12px;
  letter-spacing: 0.01em;
  font-weight: 550;
  margin: 3px 0 20px;
  display: flex;
  justify-content: space-between;
}
.column h3 span {
  color: var(--muted);
}
.workflow-card {
  display: block;
  width: 100%;
  text-align: left;
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 5px;
  color: var(--fg);
  padding: 16px;
  margin-top: 12px;
}
.workflow-card:hover {
  border-color: var(--accent);
}
.workflow-card strong {
  font-weight: 500;
  font-size: 13px;
  display: block;
  margin: 12px 0;
  overflow-wrap: anywhere;
}
.workflow-card p {
  font-size: 11px;
  margin-bottom: 16px;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}
.card-meta {
  display: flex;
  justify-content: space-between;
  gap: 5px;
  font-size: 10px;
  color: var(--muted);
}
.empty-column {
  padding: 30px 5px;
  text-align: center;
  font-size: 11px;
}
.welcome {
  border: 1px dashed var(--line);
  padding: 30px;
  text-align: center;
  border-radius: 7px;
  margin-bottom: 22px;
}
.welcome h3 {
  font-size: 23px;
  margin-bottom: 12px;
}
.welcome p {
  font-size: 13px;
  max-width: 510px;
  margin: auto;
}
.activity {
  margin-top: 40px;
  border-top: 1px solid var(--line);
  padding-top: 25px;
}
.activity h2 {
  font-size: 23px;
  margin-bottom: 17px;
}
.activity-row {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
  overflow-wrap: anywhere;
}
.activity-row time {
  color: var(--muted);
  font-size: 10px;
  flex-shrink: 0;
}
.settings-grid {
  display: grid;
  grid-template-columns: 210px 1fr;
  gap: 50px;
}
.settings-nav {
  display: flex;
  flex-direction: column;
  gap: 13px;
  font-size: 13px;
  align-self: start;
  position: sticky;
  top: 30px;
}
.settings-nav a {
  color: var(--muted);
}
.settings-nav a:hover {
  color: var(--highlight);
}
.settings-content {
  max-width: 850px;
  min-width: 0;
}
.settings-section {
  border: 1px solid var(--line);
  background: var(--panel);
  border-radius: 8px;
  padding: 30px;
  margin-bottom: 22px;
  scroll-margin-top: 30px;
}
.settings-section h2 {
  font-size: 25px;
  margin-bottom: 10px;
}
.settings-section > p {
  font-size: 13px;
  margin-bottom: 25px;
}
.settings-section .section-label {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 18px;
}
.settings-section .section-label h2 {
  margin: 0;
}
.provider-status {
  font-size: 12px;
  color: var(--muted);
}
.provider-status p {
  margin: 8px 0 0;
}
.settings-section a.text-link {
  color: var(--highlight);
  text-decoration: underline;
}
.swatches {
  display: flex;
  gap: 10px;
  margin-bottom: 20px;
  flex-wrap: wrap;
}
.swatch {
  background: var(--bg);
  border: 1px solid var(--line);
  border-radius: 5px;
  color: var(--fg);
  padding: 9px 12px;
  font-size: 11px;
  display: flex;
  align-items: center;
  gap: 8px;
}
.swatch i {
  width: 13px;
  height: 13px;
  border-radius: 50%;
}
.theme-preview {
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 23px;
  margin: 20px 0;
  background: var(--bg);
}
.theme-preview p {
  font-size: 12px;
  margin: 8px 0 18px;
}
.notice {
  border-left: 2px solid var(--accent);
  padding: 0 0 0 15px;
  font-size: 12px;
  margin: 20px 0;
}
.dialog {
  background: var(--panel);
  color: var(--fg);
  border: 1px solid var(--line);
  border-radius: 12px;
  width: min(570px, calc(100vw - 32px));
  max-height: calc(100dvh - 40px);
  padding: 30px;
  box-shadow: 0 25px 100px #0008;
}
.dialog::backdrop {
  background: #0009;
  backdrop-filter: blur(5px);
}
.dialog-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 25px;
}
.dialog-top h2 {
  font-size: 27px;
}
.close {
  border: 1px solid var(--line);
  background: transparent;
  color: var(--fg);
  border-radius: 50%;
  width: 34px;
  height: 34px;
  font-size: 22px;
}
.dialog .actions {
  justify-content: space-between;
  margin-top: 7px;
}
.dialog small {
  line-height: 1.5;
}
.skip {
  position: fixed;
  top: -70px;
  left: 15px;
  background: var(--accent);
  color: var(--on-accent);
  padding: 10px;
  z-index: 100;
}
.skip:focus {
  top: 10px;
}
#toast {
  position: fixed;
  bottom: 25px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--fg);
  color: var(--bg);
  border-radius: 5px;
  padding: 12px 24px;
  font-size: 13px;
  z-index: 30;
  max-width: calc(100vw - 30px);
  box-shadow: 0 8px 30px #0005;
}
#toast:empty {
  display: none;
}
.loading {
  padding: 100px 0;
  text-align: center;
}
.loading h1 {
  font-size: 36px;
}
.loading p {
  margin: 20px 0;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
}
@media (min-width: 1500px) {
  .hero {
    padding-top: 110px;
    padding-bottom: 100px;
  }
}
@media (max-width: 1050px) {
  .wrap {
    padding: 0 28px;
  }
  .nav {
    gap: 20px;
  }
  .nav-links {
    gap: 18px;
  }
  .hero {
    gap: 30px;
  }
  .provider-names {
    gap: 27px;
  }
  .auth-story {
    padding-right: 40px;
  }
  .auth-form-wrap {
    padding-left: 40px;
  }
  .board {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
  .settings-grid {
    grid-template-columns: 150px 1fr;
    gap: 25px;
  }
}
@media (max-width: 760px) {
  .wrap {
    padding: 0 22px;
  }
  .nav {
    min-height: 79px;
    gap: 15px;
    flex-wrap: wrap;
    padding-top: 15px;
    padding-bottom: 15px;
  }
  .brand {
    font-size: 16px;
    gap: 7px;
  }
  .brand span {
    padding-left: 10px;
  }
  .contact img {
    width: 52px;
    height: 29px;
  }
  .nav-links {
    order: 3;
    width: 100%;
    justify-content: center;
    border-top: 1px solid var(--line);
    padding-top: 12px;
    gap: 24px;
  }
  .nav-actions {
    margin-left: auto;
    gap: 12px;
  }
  .nav-actions .button {
    padding: 9px 12px;
    font-size: 11px;
  }
  .nav-actions > a:not(.button) {
    font-size: 11px;
  }
  .hero {
    grid-template-columns: 1fr;
    padding: 52px 0;
    gap: 45px;
  }
  .hero h1 {
    font-size: 54px;
  }
  .hero .intro {
    font-size: 14px;
    max-width: 470px;
  }
  .scene {
    padding-left: 16px;
    max-width: 520px;
    width: 100%;
    margin: auto;
  }
  .hero-note {
    font-size: 10px;
  }
  .providers-band {
    align-items: start;
    flex-direction: column;
    gap: 20px;
  }
  .providers-band > p {
    max-width: none;
  }
  .provider-names {
    gap: 25px;
    width: 100%;
    flex-wrap: wrap;
  }
  .provider-name {
    font-size: 16px;
  }
  .section {
    padding: 55px 0;
  }
  .section-top {
    display: block;
    margin-bottom: 30px;
  }
  .section-top > p {
    margin-top: 20px;
    max-width: 500px;
  }
  .features {
    grid-template-columns: 1fr;
    gap: 32px;
  }
  .number {
    margin-bottom: 17px;
  }
  .feature p {
    max-width: 520px;
  }
  .closing {
    padding: 55px 0;
  }
  .footer {
    flex-direction: column;
    gap: 12px;
  }
  .auth {
    grid-template-columns: 1fr;
  }
  .auth-story {
    padding: 40px 0 30px;
    border-right: none;
    border-bottom: 1px solid var(--line);
  }
  .auth-story h1 {
    font-size: 38px;
  }
  .auth-story > p {
    margin: 18px 0 0;
  }
  .auth-points {
    display: none;
  }
  .auth-form-wrap {
    padding: 35px 0 50px;
  }
  .workspace {
    padding-top: 30px;
    padding-bottom: 45px;
  }
  .workspace-title {
    align-items: start;
    flex-wrap: wrap;
  }
  .workspace-title h1 {
    font-size: 32px;
  }
  .stats {
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
  }
  .stat {
    padding: 15px;
  }
  .settings-grid {
    grid-template-columns: 1fr;
    gap: 23px;
  }
  .settings-nav {
    position: static;
    flex-direction: row;
    flex-wrap: wrap;
    gap: 20px;
  }
  .settings-section {
    padding: 22px;
  }
  .activity-row {
    flex-direction: column;
    gap: 3px;
  }
  .dialog {
    padding: 22px;
  }
  .workspace-providers {
    gap: 8px;
  }
  .provider-chip {
    padding: 8px 11px;
  }
  .toolbar {
    flex-wrap: wrap;
  }
  .search {
    max-width: none;
  }
  .board {
    gap: 10px;
  }
  .column {
    padding: 10px;
  }
  .workflow-card {
    padding: 12px;
  }
  .two-fields {
    gap: 12px;
  }
  .section .eyebrow {
    margin-bottom: 18px;
  }
}
@media (max-width: 400px) {
  .wrap {
    padding: 0 16px;
  }
  .brand {
    font-size: 14px;
  }
  .nav-actions {
    gap: 9px;
  }
  .hero h1 {
    font-size: 45px;
  }
  .nav {
    gap: 8px;
  }
  .brand span {
    padding-left: 8px;
  }
  .contact img {
    width: 43px;
  }
  .provider-names {
    gap: 16px;
  }
  .board {
    grid-template-columns: 1fr;
  }
  .two-fields {
    grid-template-columns: 1fr;
  }
  .provider-chip {
    font-size: 11px;
  }
  .demo-body {
    padding: 20px 14px;
  }
  .demo-stat {
    padding: 10px;
  }
  .demo-row {
    font-size: 9px;
  }
  .floating-note {
    font-size: 10px;
  }
  .dialog .actions {
    gap: 8px;
  }
  .button {
    padding: 12px 18px;
  }
}
@media (prefers-reduced-motion: reduce) {
  html {
    scroll-behavior: auto;
  }
  * {
    animation: none !important;
    transition: none !important;
  }
}
