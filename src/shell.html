<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0b0d0d" />
<title>Delux Crew — Ember Spark</title>
<style>
@font-face{font-family:Kode;src:url('/assets/kode-mono-600.woff2')} 
:root{--bg:#0b0d0d;--surface:#111514;--surface-2:#171b19;--surface-3:#202521;--line:#303633;--text:#f2f0e9;--muted:#9ba09a;--gold:#d7b77a;--gold-strong:#f0cb88;--copper:#b7795e;--teal:#84b9ad;--danger:#d98175;--shadow:0 24px 90px rgba(0,0,0,.32)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 80% -5%,#28322e 0,#0b0d0d 35%);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,sans-serif;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:1480px;margin:auto;padding:0 34px 70px}.topbar{height:64px;display:flex;align-items:center;gap:16px;border-bottom:1px solid var(--line)}.brand-lockup{display:flex;align-items:center;gap:10px;min-width:240px}.brand-lockup img{width:30px;height:30px;object-fit:contain}.brand{font:13px Kode,monospace;letter-spacing:.05em}.brand small{font:10px Inter;color:var(--muted);margin-left:7px}.nav{display:flex;gap:20px;align-items:center}.nav button{background:none;border:0;color:var(--muted);font-size:12px;padding:8px 0}.nav button.active,.nav button:hover{color:var(--text)}.spacer{flex:1}.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:11px}.status i{width:6px;height:6px;border-radius:50%;background:var(--teal);box-shadow:0 0 12px var(--teal)}.profile{width:31px;height:31px;border-radius:50%;border:1px solid var(--gold);background:#d8bc84;color:#17130e;font-weight:700}.primary,.ghost{border:1px solid var(--line);border-radius:3px;padding:10px 15px;background:transparent;color:var(--text);font-size:12px}.primary{background:var(--gold);border-color:var(--gold);color:#16130e;font-weight:700}.ghost:hover{border-color:var(--gold);color:var(--gold-strong)}.landing{padding:82px 0 0}.landing-grid{display:grid;grid-template-columns:1fr 1fr;gap:70px;align-items:center}.eyebrow{font:10px Kode,monospace;letter-spacing:.2em;color:var(--gold);text-transform:uppercase}.landing h1{font-size:clamp(48px,7vw,92px);line-height:.91;letter-spacing:-.075em;font-weight:500;margin:18px 0 24px;max-width:690px}.landing h1 em{font-style:normal;color:var(--gold)}.landing-copy{font-size:16px;line-height:1.65;color:var(--muted);max-width:480px}.cta-row{display:flex;gap:12px;margin:28px 0 18px}.fine{font-size:10px;color:#68706b}.workspace-card{position:relative;border:1px solid var(--line);background:#121614;border-radius:8px;padding:12px;box-shadow:var(--shadow);transform:rotate(1deg)}.workspace-card img{display:block;width:100%;border-radius:3px;opacity:.92}.workspace-label{display:flex;justify-content:space-between;color:var(--muted);font:9px Kode;margin:0 5px 10px}.landing-strip{margin-top:96px;padding:19px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);display:flex;gap:36px;align-items:center;color:var(--muted);font-size:11px}.strip-title{font:10px Kode;letter-spacing:.16em;color:var(--gold);margin-right:auto}.landing-strip span{color:var(--text)}.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-top:80px;background:var(--line)}.feature{background:var(--bg);padding:24px;min-height:150px}.feature b{font:10px Kode;color:var(--gold)}.feature h3{font-size:20px;font-weight:500;margin:24px 0 8px}.feature p{color:var(--muted);line-height:1.5;margin:0}.office-view{padding-top:25px}.view-heading{display:flex;align-items:end;justify-content:space-between;margin:25px 0}.view-heading h1{font-size:42px;line-height:1;margin:8px 0 0;font-weight:500;letter-spacing:-.06em}.view-heading p{color:var(--muted);margin:12px 0 0}.layout{display:grid;grid-template-columns:minmax(0,1fr) 355px;gap:18px}.panel{background:linear-gradient(145deg,rgba(22,27,24,.96),rgba(14,17,16,.96));border:1px solid var(--line);border-radius:6px;box-shadow:var(--shadow)}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}.panel-head h2{font-size:12px;font-weight:600;letter-spacing:.04em;margin:0}.panel-head span{font-size:10px;color:var(--muted)}.office{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:18px;min-height:330px;background:linear-gradient(135deg,rgba(14,18,16,.5),rgba(28,32,28,.35))}.department{text-align:left;position:relative;min-height:140px;border:1px solid var(--line);border-radius:5px;background:linear-gradient(145deg,#202723,#141917);color:var(--text);padding:14px;box-shadow:inset 0 -28px 40px rgba(0,0,0,.2);transition:.2s}.department:hover,.department.active{border-color:var(--accent);transform:translateY(-2px);box-shadow:0 0 0 1px var(--accent),inset 0 -28px 40px rgba(0,0,0,.2)}.dept-top,.dept-foot{display:flex;justify-content:space-between;gap:6px;font-size:10px;color:var(--muted)}.dept-dot{width:6px;height:6px;background:var(--accent);border-radius:50%;box-shadow:0 0 10px var(--accent)}.dept-name{flex:1}.dept-count{font-size:38px;line-height:1;margin:26px 0 2px}.dept-meta{font-size:10px;color:var(--muted)}.dept-foot{position:absolute;bottom:12px;left:14px;right:14px;font-size:9px}.feed{padding:6px 18px}.feed-item{display:flex;gap:14px;padding:14px 0;border-bottom:1px solid rgba(48,54,51,.7)}.feed-mark{font:10px Kode;color:var(--gold)}.feed-copy{font-size:12px}.feed-copy small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.taskbar{display:flex;gap:8px;padding:18px}.taskbar input{flex:1;background:#0c0f0e;border:1px solid var(--line);border-radius:3px;color:var(--text);padding:12px}.queue-item{padding:15px 18px;border-bottom:1px solid var(--line)}.queue-title{font-size:12px;line-height:1.35}.queue-meta{display:flex;justify-content:space-between;gap:8px;margin-top:9px;font-size:10px;color:var(--muted)}.pill{color:var(--gold);font:9px Kode}.metrics{display:grid;grid-template-columns:1fr 1fr}.metric{padding:16px 18px;border-bottom:1px solid var(--line)}.metric:nth-child(odd){border-right:1px solid var(--line)}.metric strong{display:block;font-size:23px;font-weight:500}.metric span{color:var(--muted);font-size:10px}.agent-list{padding:5px 18px 12px}.agent{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.avatar{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;color:#0d1110;font-size:9px;font-weight:700}.agent-name{font-size:11px}.agent-role{color:var(--muted);font-size:9px;margin-top:2px}.agent-state{margin-left:auto;color:var(--teal);font:9px Kode}.settings{max-width:920px;padding-top:48px}.settings h1{font-size:44px;letter-spacing:-.06em;font-weight:500;margin:8px 0}.settings-intro{color:var(--muted);line-height:1.6;max-width:580px}.settings-section{border-top:1px solid var(--line);padding:26px 0;display:grid;grid-template-columns:230px 1fr;gap:40px}.settings-section h2{font-size:13px;margin:0}.settings-section p{font-size:11px;line-height:1.5;color:var(--muted);margin:7px 0}.setting-row{display:flex;align-items:center;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--line);gap:20px}.setting-row strong{font-size:12px;font-weight:500}.setting-row small{display:block;color:var(--muted);font-size:10px;margin-top:4px}.toggle{width:38px;height:21px;border-radius:20px;border:1px solid var(--line);background:#252b27;padding:2px}.toggle i{display:block;width:15px;height:15px;background:#7a827c;border-radius:50%;transition:.2s}.toggle.on{background:var(--gold);border-color:var(--gold)}.toggle.on i{background:#1d1a13;transform:translateX(15px)}.swatches{display:flex;gap:8px}.swatch{width:30px;height:30px;border:2px solid transparent;border-radius:50%}.swatch.active{border-color:var(--text);outline:1px solid var(--gold)}.toast{position:fixed;right:28px;bottom:26px;background:#e5d09d;color:#1c1810;padding:12px 16px;border-radius:3px;font-size:12px;opacity:0;transform:translateY(8px);transition:.2s}.toast.show{opacity:1;transform:none}@media(max-width:900px){.app{padding:0 18px 50px}.nav{display:none}.landing{padding-top:52px}.landing-grid,.layout{grid-template-columns:1fr}.workspace-card{transform:none}.feature-grid{grid-template-columns:1fr}.landing-strip{flex-wrap:wrap;gap:16px}.strip-title{width:100%}.office{grid-template-columns:1fr 1fr}.settings-section{grid-template-columns:1fr;gap:14px}.brand-lockup{min-width:0}.status{display:none}}@media(max-width:520px){.office{grid-template-columns:1fr}.landing h1{font-size:54px}.cta-row{flex-wrap:wrap}.taskbar{flex-direction:column}}
</style>
</head>
<body><main id="app" class="app"></main><div id="toast" class="toast" role="status" aria-live="polite"></div><script><!--APP--></script></body></html>
