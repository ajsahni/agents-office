<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#0a0d12" />
<title>Agents Office — Command Centre</title>
<style>
@font-face{font-family:Kode;src:url('/assets/kode-mono-600.woff2')} 
:root{--bg:#090c11;--panel:#11161d;--panel2:#151c25;--line:#27313c;--text:#edf2f4;--muted:#8b98a5;--green:#59deb7;--amber:#e7c76c;--blue:#8fd3f4;--red:#f08b8b;--purple:#bea4e8;--shadow:0 24px 70px rgba(0,0,0,.28)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0%,#16232a 0,#090c11 42%);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,sans-serif;min-height:100vh}button,input{font:inherit}button{cursor:pointer}.app{max-width:1500px;margin:0 auto;padding:24px 28px 40px}.topbar{display:flex;align-items:center;gap:18px;padding:4px 0 24px;border-bottom:1px solid var(--line)}.brand{font-family:Kode,monospace;letter-spacing:.04em;font-size:18px}.brand small{font:11px Inter;color:var(--muted);margin-left:10px}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.status i{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 14px var(--green)}.spacer{flex:1}.top-actions{display:flex;gap:8px}.ghost,.primary{border:1px solid var(--line);border-radius:9px;padding:9px 13px;background:transparent;color:var(--text)}.ghost:hover{background:var(--panel2);border-color:#40505d}.primary{background:var(--green);color:#07120f;border-color:var(--green);font-weight:700}.hero{display:flex;justify-content:space-between;gap:24px;align-items:end;padding:34px 0 26px}.eyebrow{font:11px Kode,monospace;letter-spacing:.18em;color:var(--green);text-transform:uppercase}.hero h1{font-size:clamp(32px,4vw,56px);line-height:.98;letter-spacing:-.05em;margin:10px 0 12px;max-width:700px}.hero p{margin:0;color:var(--muted);max-width:620px;line-height:1.6}.heartbeat{border:1px solid var(--line);background:rgba(17,22,29,.8);border-radius:14px;padding:16px 18px;min-width:235px}.heartbeat strong{display:block;font-size:26px}.heartbeat span{color:var(--muted);font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:18px}.panel{background:linear-gradient(145deg,rgba(21,28,37,.96),rgba(13,18,24,.96));border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}.panel-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid var(--line)}.panel-head h2{font-size:14px;margin:0}.panel-head span{font-size:12px;color:var(--muted)}.office{padding:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.department{position:relative;text-align:left;background:var(--panel2);border:1px solid var(--line);border-radius:13px;padding:15px;min-height:154px;color:var(--text);transition:.2s}.department:hover,.department.active{border-color:var(--accent);transform:translateY(-2px)}.dept-top{display:flex;align-items:center;gap:9px}.dept-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent)}.dept-name{font:11px Kode,monospace;letter-spacing:.12em}.dept-count{font-size:36px;letter-spacing:-.07em;margin:18px 0 3px}.dept-meta{color:var(--muted);font-size:12px}.dept-foot{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:15px;padding-top:10px;font-size:11px;color:var(--muted)}.agent-list{display:flex;flex-direction:column;gap:8px;padding:14px 20px 20px}.agent{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;background:#0e141b;border:1px solid transparent}.agent:hover{border-color:var(--line)}.avatar{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#06100d;font-weight:800;font-size:11px}.agent-name{font-size:12px;font-weight:700}.agent-role{font-size:11px;color:var(--muted);margin-top:2px}.agent-state{margin-left:auto;font:10px Kode;color:var(--green);text-transform:uppercase}.feed{padding:16px 20px 20px}.feed-item{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.feed-item:last-child{border-bottom:0}.feed-mark{color:var(--green);font:12px Kode}.feed-copy{font-size:12px;line-height:1.5}.feed-copy small{display:block;color:var(--muted);margin-top:4px}.taskbar{grid-column:1/-1;display:flex;gap:10px;padding:16px 20px;border-top:1px solid var(--line)}.taskbar input{flex:1;min-width:0;background:#0b1016;border:1px solid var(--line);border-radius:9px;color:var(--text);padding:12px 14px;outline:none}.taskbar input:focus{border-color:var(--green);box-shadow:0 0 0 3px rgba(89,222,183,.12)}.queue{padding:0 20px 20px}.queue-item{padding:13px 0;border-bottom:1px solid var(--line)}.queue-item:last-child{border:0}.queue-title{font-size:12px;line-height:1.45}.queue-meta{display:flex;justify-content:space-between;margin-top:8px;color:var(--muted);font:10px Kode}.pill{color:var(--amber)}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:16px 20px 20px}.metric{background:#0d131a;border:1px solid var(--line);border-radius:10px;padding:12px}.metric strong{display:block;font-size:22px}.metric span{font-size:10px;color:var(--muted);line-height:1.3}.toast{position:fixed;right:24px;bottom:24px;background:var(--green);color:#06100d;padding:12px 16px;border-radius:10px;font-weight:700;box-shadow:var(--shadow);transform:translateY(20px);opacity:0;transition:.25s}.toast.show{transform:none;opacity:1}@media(max-width:980px){.layout{grid-template-columns:1fr}.office{grid-template-columns:repeat(2,minmax(0,1fr))}.hero{align-items:start;flex-direction:column}.heartbeat{width:100%}}@media(max-width:560px){.app{padding:16px}.topbar{flex-wrap:wrap}.top-actions{width:100%}.top-actions button{flex:1}.office{grid-template-columns:1fr}.taskbar{flex-direction:column}.taskbar button{width:100%}}
</style>
</head>
<body><main id="app" class="app"></main><div id="toast" class="toast" role="status" aria-live="polite"></div><script><!--APP--></script></body></html>
